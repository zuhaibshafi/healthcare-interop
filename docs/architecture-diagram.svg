<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="860" viewBox="0 0 1400 860" font-family="Segoe UI, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#444"/>
    </marker>
    <marker id="arrowd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8a6d00"/>
    </marker>
  </defs>
  <rect width="1400" height="860" fill="#fafafa"/>
  <text x="700" y="34" text-anchor="middle" font-size="22" font-weight="600" fill="#222">Healthcare Interoperability Assessment – Local Solution Architecture (Windows, no Docker)</text>
  <text x="700" y="56" text-anchor="middle" font-size="13" fill="#555">HAPI FHIR R4 · eCRNow · UDS+ submitter · Inferno test kits · .NET integration layer</text>

  <!-- Clients -->
  <rect x="30" y="90" width="250" height="150" rx="10" fill="#eef3ff" stroke="#4a6fd1" stroke-width="1.5"/>
  <text x="155" y="114" text-anchor="middle" font-weight="600" fill="#2a4aa0">Clients / demo drivers</text>
  <text x="45" y="140" fill="#333">• PowerShell scripts (start-all.ps1)</text>
  <text x="45" y="160" fill="#333">• python scripts/ecrnow-demo.py</text>
  <text x="45" y="180" fill="#333">• curl / .http requests</text>
  <text x="45" y="200" fill="#333">• Swagger UIs (HAPI, eCRNow, .NET)</text>
  <text x="45" y="220" fill="#333">• Browser: Inferno UIs</text>

  <!-- .NET layer -->
  <rect x="30" y="290" width="400" height="300" rx="10" fill="#e8f5ee" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="230" y="314" text-anchor="middle" font-weight="600" fill="#1f6b43">.NET 9 Integration Layer  —  FhirIntegration.Api  :5080</text>
  <text x="230" y="332" text-anchor="middle" fill="#555" font-size="12">ASP.NET Core minimal API · Firely SDK (Hl7.Fhir.R4) · Swagger</text>
  <rect x="45" y="345" width="370" height="40" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="55" y="361" fill="#222" font-weight="600">FHIR Gateway</text>
  <text x="55" y="377" fill="#444" font-size="12">/api/patients · /api/encounters · $everything · $validate · transaction</text>
  <rect x="45" y="392" width="370" height="40" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="55" y="408" fill="#222" font-weight="600">OAuth2 client-credentials facade</text>
  <text x="55" y="424" fill="#444" font-size="12">POST /oauth/token  (lets eCRNow use SMART "System" auth)</text>
  <rect x="45" y="439" width="370" height="40" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="55" y="455" fill="#222" font-weight="600">Mock Public Health Agency / AIMS receiver</text>
  <text x="55" y="471" fill="#444" font-size="12">POST /pha/r4/fhir/$process-message → Reportability Response</text>
  <rect x="45" y="486" width="370" height="46" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="55" y="502" fill="#222" font-weight="600">UDS+ Data Submitter + Trust Service Provider</text>
  <text x="55" y="518" fill="#444" font-size="12">Group/$export → de-identify → UDS+ profiles → validate → manifest</text>
  <rect x="45" y="539" width="370" height="40" rx="6" fill="#fff" stroke="#2e8b57"/>
  <text x="55" y="555" fill="#222" font-weight="600">Mock HRSA Data Receiver</text>
  <text x="55" y="571" fill="#444" font-size="12">POST /udsplus/$import · GET /udsplus/$import-status/{id}</text>

  <!-- HAPI -->
  <rect x="540" y="90" width="330" height="200" rx="10" fill="#fff4e5" stroke="#e08a00" stroke-width="1.5"/>
  <text x="705" y="114" text-anchor="middle" font-weight="600" fill="#9a5f00">HAPI FHIR R4 JPA Server 8.12  :8080</text>
  <text x="705" y="132" text-anchor="middle" fill="#555" font-size="12">Spring Boot WAR · JDK 21 · persistent H2 (hapi-runtime\h2)</text>
  <text x="555" y="158" fill="#333">• US Core sample data (19 resources, Amy Shaw)</text>
  <text x="555" y="178" fill="#333">• Bulk Data $export on Group/uds-plus-reporting-group</text>
  <text x="555" y="198" fill="#333">• R4 Subscriptions (rest-hook) enabled</text>
  <text x="555" y="218" fill="#333">• client_id_strategy ANY, OpenAPI at /fhir/swagger-ui</text>
  <text x="555" y="238" fill="#333">• $validate, $everything, _revinclude</text>
  <text x="555" y="268" fill="#777" font-size="12">Production analogue: AWS HealthLake FHIR store</text>

  <!-- eCRNow -->
  <rect x="540" y="330" width="330" height="260" rx="10" fill="#fdecec" stroke="#c0392b" stroke-width="1.5"/>
  <text x="705" y="354" text-anchor="middle" font-weight="600" fill="#8e2a1f">eCRNow (drajer-health)  :8081</text>
  <text x="705" y="372" text-anchor="middle" fill="#555" font-size="12">Spring Boot WAR · JDK 21 · db-scheduler timers</text>
  <rect x="555" y="385" width="300" height="60" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="565" y="403" fill="#222" font-weight="600">Knowledge Artifacts (kar.directory)</text>
  <text x="565" y="420" fill="#444" font-size="12">eRSD PlanDefinition + 706 trigger ValueSets</text>
  <text x="565" y="436" fill="#444" font-size="12">(FHIRPath typo $procedureOrders fixed locally)</text>
  <rect x="555" y="452" width="300" height="74" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="565" y="470" fill="#222" font-weight="600">Reporting workflow</text>
  <text x="565" y="487" fill="#444" font-size="12">encounter-start → check-trigger-codes (dxtc)</text>
  <text x="565" y="503" fill="#444" font-size="12">→ create-report (eICR) → validate → submit</text>
  <text x="565" y="519" fill="#444" font-size="12">REST APIs: healthcareSettings · addKARStatus · launchPatient</text>
  <rect x="555" y="535" width="300" height="42" rx="6" fill="#fff" stroke="#c0392b"/>
  <text x="565" y="553" fill="#222" font-weight="600">PostgreSQL 16  :5432  (db ecrnow)</text>
  <text x="565" y="569" fill="#444" font-size="12">portable EDB binaries, user postgres</text>

  <!-- Inferno -->
  <rect x="960" y="90" width="410" height="500" rx="10" fill="#f1e9fb" stroke="#7d3c98" stroke-width="1.5"/>
  <text x="1165" y="114" text-anchor="middle" font-weight="600" fill="#5b2c6f">Inferno conformance tooling (Ruby 3.3, native Windows)</text>
  <rect x="975" y="130" width="380" height="90" rx="6" fill="#fff" stroke="#7d3c98"/>
  <text x="985" y="150" fill="#222" font-weight="600">US Core Server test kit  :4567</text>
  <text x="985" y="168" fill="#444" font-size="12">Suite us_core_v610 (FHIR API group) → tests HAPI</text>
  <text x="985" y="184" fill="#444" font-size="12">inputs: url=http://localhost:8080/fhir, patient_ids=demo-patient-1</text>
  <text x="985" y="200" fill="#444" font-size="12">Puma web + Sidekiq worker, SQLite</text>
  <rect x="975" y="232" width="380" height="90" rx="6" fill="#fff" stroke="#7d3c98"/>
  <text x="985" y="252" fill="#222" font-weight="600">UDS+ test kit 1.3.0  :4568</text>
  <text x="985" y="270" fill="#444" font-size="12">Acts as HRSA Data Receiver: reads Import Manifest,</text>
  <text x="985" y="286" fill="#444" font-size="12">downloads NDJSON, validates against fhir.hrsa.uds-plus#2.0.0</text>
  <text x="985" y="302" fill="#444" font-size="12">Puma web + Sidekiq worker, SQLite</text>
  <rect x="975" y="334" width="380" height="74" rx="6" fill="#fff" stroke="#7d3c98"/>
  <text x="985" y="354" fill="#222" font-weight="600">HL7 FHIR validator wrapper 1.0.85  :8082</text>
  <text x="985" y="372" fill="#444" font-size="12">Standalone jar (Ktor/Jetty). POST /validate with IG list.</text>
  <text x="985" y="388" fill="#444" font-size="12">Package cache %USERPROFILE%\.fhir\packages</text>
  <text x="985" y="404" fill="#444" font-size="12">Shared by Inferno kits and the .NET layer</text>
  <rect x="975" y="420" width="380" height="42" rx="6" fill="#fff" stroke="#7d3c98"/>
  <text x="985" y="440" fill="#222" font-weight="600">Redis 8  :6379</text>
  <text x="985" y="456" fill="#444" font-size="12">Sidekiq job queues (db 0 = US Core kit, db 1 = UDS+ kit)</text>
  <text x="985" y="490" fill="#555" font-size="12">Windows enablers: RubyInstaller+MSYS2, ffi gem,</text>
  <text x="985" y="506" fill="#555" font-size="12">Redis ≥ 6.2 (HELLO), FHIR_RESOURCE_VALIDATOR_URL</text>

  <!-- Arrows -->
  <!-- clients -> dotnet -->
  <line x1="155" y1="240" x2="155" y2="290" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- clients -> hapi -->
  <line x1="280" y1="150" x2="540" y2="150" stroke="#444" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="410" y="143" text-anchor="middle" fill="#444" font-size="11">FHIR REST (transaction, read, search)</text>
  <!-- dotnet gateway -> hapi -->
  <line x1="430" y1="365" x2="540" y2="250" stroke="#2e8b57" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="498" y="300" text-anchor="middle" fill="#2e8b57" font-size="11">Firely FhirClient</text>
  <!-- dotnet uds -> hapi bulk -->
  <line x1="430" y1="505" x2="540" y2="200" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="470" y="430" fill="#2e8b57" font-size="11" transform="rotate(-70 470 430)">Group/$export + NDJSON</text>
  <!-- ecrnow -> hapi -->
  <line x1="705" y1="330" x2="705" y2="290" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="790" y="314" text-anchor="middle" fill="#c0392b" font-size="11">US Core R4 queries</text>
  <!-- ecrnow -> dotnet pha -->
  <line x1="540" y1="470" x2="415" y2="460" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="452" text-anchor="middle" fill="#c0392b" font-size="11">eICR $process-message</text>
  <!-- dotnet auth -> ecrnow -->
  <line x1="415" y1="412" x2="540" y2="400" stroke="#8a6d00" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrowd)"/>
  <text x="478" y="396" text-anchor="middle" fill="#8a6d00" font-size="11">tokens</text>
  <!-- dotnet -> ecrnow launch -->
  <line x1="415" y1="565" x2="540" y2="560" stroke="#444" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="478" y="580" text-anchor="middle" fill="#444" font-size="11">/api/launchPatient</text>
  <!-- inferno us core -> hapi -->
  <line x1="975" y1="175" x2="870" y2="175" stroke="#7d3c98" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="922" y="168" text-anchor="middle" fill="#7d3c98" font-size="11">conformance tests</text>
  <!-- dotnet uds -> inferno uds kit (manifest) -->
  <path d="M 415 509 C 700 640, 900 640, 1165 322" fill="none" stroke="#2e8b57" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arrow)"/>
  <text x="760" y="632" text-anchor="middle" fill="#2e8b57" font-size="11">Import Manifest URL → UDS+ kit validates NDJSON files</text>
  <!-- dotnet -> validator -->
  <path d="M 415 520 C 650 700, 950 700, 1165 408" fill="none" stroke="#2e8b57" stroke-width="1.2" stroke-dasharray="2 3" marker-end="url(#arrow)"/>
  <text x="760" y="690" text-anchor="middle" fill="#2e8b57" font-size="11">POST /validate (fhir.hrsa.uds-plus#2.0.0)</text>

  <!-- Footer: data flows -->
  <rect x="30" y="720" width="1340" height="120" rx="10" fill="#fff" stroke="#bbb"/>
  <text x="45" y="744" font-weight="600" fill="#222">Demonstrated flows</text>
  <text x="45" y="766" fill="#333">1. FHIR CRUD/search: transaction bundle → HAPI; reads, searches, $everything, $validate via curl and via the .NET gateway.</text>
  <text x="45" y="786" fill="#333">2. eCR: register HAPI in eCRNow → activate eRSD KAR → launchPatient(demo-patient-1, demo-encounter-1) → COVID-19 trigger (SNOMED 840539006 ∈ ValueSet dxtc) → eICR → mock PHA.</text>
  <text x="45" y="806" fill="#333">3. UDS+: HAPI Group/$export → de-identify → UDS+ profiles → HL7 validator → Import Manifest → $import (mock receiver) and Inferno UDS+ kit.</text>
  <text x="45" y="826" fill="#333">4. Conformance: Inferno US Core v6.1.0 FHIR API tests against HAPI; Inferno UDS+ kit against the generated submission.</text>
</svg>
