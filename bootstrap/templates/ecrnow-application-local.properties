# eCRNow local overrides (loaded via --spring.config.additional-location)
jdbc.url=jdbc:postgresql://localhost:5432/ecrnow
jdbc.username=postgres
jdbc.password=postgres
server.port=8081
logging.file.name={{ROOT}}/ecrnow-runtime/logs/ecrNow.log

# Knowledge artifacts (eRSD PlanDefinition bundles) are loaded from this folder at startup
kar.directory={{ROOT}}/ecrnow-runtime/kars
bsa.output.directory={{ROOT}}/ecrnow-runtime/bsa-output/
custom-query.directory={{ROOT}}/ecrnow-runtime/custom-queries
scheduled.task.file.path={{ROOT}}/ecrnow-runtime/scheduled-task/scheduledTask.json

# Legacy Release-2 property, must point to a non-existent file for Release 3.x
ersd.file.location={{ROOT}}/ecrnow-runtime/dummy.json

# eICR validation artefacts (schematron only; XSD validation disabled locally)
schematron.file.location={{ROOT}}/ecrnow-runtime/schematrons/CDAR2_IG_PHCASERPT_R2_STU1.1_SCHEMATRON.sch
eicr.R31.schematron.file.location={{ROOT}}/ecrnow-runtime/schematrons/CDAR2_IG_PHCASERPT_R2_STU1.1_SCHEMATRON.sch
xsd.schemas.location={{ROOT}}/ecrnow-runtime/schematrons/CDA_SDTC.xsd
validate.eicr.cdar11=false
validate.eicr.cdar31=false
validate.eicr.fhir=false

# Local HAPI FHIR R4 server
eicr.fhir.server.url=http://localhost:8080/fhir/
# Where the eICR / reports are POSTed when a KAR's submit-report action uses the REST endpoint.
# Points at the .NET integration layer (PHA receiver mock) built for this assignment.
report-submission.endpoint=http://localhost:5080/pha/r4/fhir
report-validator.endpoint=http://localhost:8080/fhir/Bundle/$validate
notification.endpoint=http://localhost:8081/api/receive-notification
workflow.endpoint=http://localhost:8081/api/invokeWorkflow

# No JWT token validation on the eCRNow API for local demo (all endpoints open)
token.validator.class=
jwks.keystore.location={{ROOT}}/ecrnow-runtime/ecr-on-fhir.jks
jwks.keystore.password=password

# Reporting period used by measure-based KARs
measure-reporting-period.start=2026-01-01T00:00:00.0-06:00
measure-reporting-period.end=2026-12-31T23:59:59.999-06:00

ehr.name=HAPI-FHIR-Local
ehr.product.name=hapi-fhir-jpaserver-starter
ehr.product.version=8.12.0
ecrnow.implementer.name=Greenway-Interop-Assessment
save.debug.files=true
startup.timedelay=5
